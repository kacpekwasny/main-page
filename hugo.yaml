baseURL: 'https://kwasnyy.pl/'
languageCode: 'en-us'
title: 'kwasnyy.pl'
theme: 'panr-terminal'
timeZone: "Europe/Warsaw"
copyright: " Copyright 2025 | <a href=\"https://creativecommons.org/licenses/by/4.0/\">Creative Commons Attribution 4.0 International License</a>"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10

    - identifier: about
      name: About
      url: /about/
      weight: 20

    - identifier: posts
      name: Posts
      url: /posts/
      weight: 40

    - identifier: contact
      name: Contact
      url: /contact/
      weight: 60

pagination:
  pageSize: 10

taxonomies:
  tag: "tags"
  author: "Kacper Kwaśny"

indexes:
  tag: "tags"

markup:
  defaultMarkdownHandler: "goldmark"
  goldmark:

    # Enable or disable smartypants (automatic conversion of ASCII punctuation to smart punctuation)
    smartypants: true

    # Enable or disable fractions (automatic conversion of fractions)
    fractions: true

    # Enable or disable superscript and subscript support
    # (enable to allow ^ and ~ for superscript and subscript)
    superscript: true
    unsafe: true

outputs:
  home:
    - HTML
    - RSS

params:
  disqus: "mydisquscode"
  theme: "dark"
  palette: "catpuccin"
  showThemeNotice: false
  showPostsSummary: true

  mode: dark

  theme:
    palette: dracula

  social:
    - name: github
      url: https://github.com/kacpekwasny

    - name: linkedin
      url: https://linkedin.com/in/myusername

languages:
  en:
    params:
      logo:
        logoText: kwasnyy

module:
  hugoVersion:
    min: "0.116.0"
